<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Grid & Study Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-wk: #f472b6;
      --accent-kaishi: #10b981;
      --accent-active-tag: #f59e0b;
      --border-color: #334155;
      
      --color-red: #ef4444;
      --color-red-bg: #450a0a;
      --color-yellow: #eab308;
      --color-yellow-bg: #422006;
      --color-green: #22c55e;
      --color-green-bg: #052e16;

      --vocab-word-color: #a855f7;

      --tile-size: minmax(60px, 1fr);
      --tile-font: 1.75rem;
      --grid-gap: 8px;
      --container-padding: 20px;
    }

    body.compact-mode {
      --tile-size: minmax(44px, 1fr);
      --tile-font: 1.25rem;
      --grid-gap: 4px;
      --container-padding: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: var(--container-padding);
      line-height: 1.5;
    }

    /* Controls Header */
    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    .control-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    select, input, button {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--accent-blue); }

    .btn { cursor: pointer; font-weight: 600; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--card-hover); }

    .btn-toggle { border-color: var(--border-color); }
    .btn-toggle.active { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

    .stats { display: flex; gap: 8px; font-size: 0.8rem; }
    .stat-badge { padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .stat-red { background: var(--color-red-bg); color: var(--color-red); }
    .stat-yellow { background: var(--color-yellow-bg); color: var(--color-yellow); }
    .stat-green { background: var(--color-green-bg); color: var(--color-green); }

    .app-layout { display: flex; gap: 20px; align-items: flex-start; }

    /* Sidebar Nav */
    .sidebar-nav {
      position: sticky;
      top: 85px;
      width: 170px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    .sidebar-title { font-size: 0.75rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
    .sidebar-links { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    
    .sidebar-link { 
      display: block; 
      padding: 5px 8px; 
      border-radius: 6px; 
      color: var(--text-main); 
      text-decoration: none; 
      font-size: 0.82rem; 
      font-weight: 500; 
      transition: background 0.15s; 
      cursor: pointer; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .sidebar-link:hover { background: var(--card-hover); color: var(--accent-blue); }

    .grid-content { flex-grow: 1; min-width: 0; }
    .section-container { margin-bottom: 24px; scroll-margin-top: 90px; }
    .section-header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--border-color); }
    .section-title { font-size: 1.2rem; font-weight: 700; }
    .section-title span.count { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; }

    /* Mark All Group */
    .mark-all-group { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-color); }
    .mark-all-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .mark-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: transform 0.15s ease; padding: 0; }
    .mark-dot:hover { transform: scale(1.2); }
    .mark-dot.dot-clear { background: #334155; }
    .mark-dot.dot-red { background: var(--color-red); }
    .mark-dot.dot-yellow { background: var(--color-yellow); }
    .mark-dot.dot-green { background: var(--color-green); }

    .kanji-grid { display: grid; grid-template-columns: repeat(auto-fill, var(--tile-size)); gap: var(--grid-gap); }

    /* Kanji Card */
    .kanji-card {
      aspect-ratio: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--tile-font);
      font-family: "Kaku Gothic Pro", "Noto Sans JP", sans-serif;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, border-color 0.2s, background-color 0.2s;
    }
    .kanji-card:hover { transform: translateY(-2px); border-color: var(--accent-blue); }
    .kanji-card[data-state="1"] { border-color: var(--color-red); background-color: var(--color-red-bg); }
    .kanji-card[data-state="2"] { border-color: var(--color-yellow); background-color: var(--color-yellow-bg); }
    .kanji-card[data-state="3"] { border-color: var(--color-green); background-color: var(--color-green-bg); }

    body.marking-mode .kanji-card { cursor: crosshair; }

    /* Uncategorized */
    details.uncategorized-details { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; margin-top: 20px; scroll-margin-top: 90px; }
    details.uncategorized-details summary { cursor: pointer; list-style: none; }
    details.uncategorized-details summary::-webkit-details-marker { display: none; }
    details.uncategorized-details .kanji-grid { margin-top: 12px; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: max-width 0.3s ease;
    }

    .modal-content.side-layout { max-width: 1000px; }
    .modal-body-container { display: flex; flex-direction: column; gap: 12px; }
    .modal-content.side-layout .modal-body-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

    .modal-close { position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; z-index: 10; }
    .modal-close:hover { color: var(--text-main); }

    .modal-header { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 14px; }
    .modal-kanji { font-size: 3.5rem; line-height: 1; font-family: "Kaku Gothic Pro", "Noto Sans JP", sans-serif; background: #0f172a; border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 12px; }

    .tag-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tag { background: var(--card-hover); color: var(--text-main); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; }

    .modal-mark-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 8px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; width: fit-content; }

    .readings-box { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .reading-item .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
    .reading-item .val { font-size: 1.05rem; font-weight: 600; color: var(--accent-blue); word-break: break-word; }

    .modal-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .meta-box { background: #0f172a; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
    .meta-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
    .meta-val { font-size: 0.875rem; font-weight: 600; margin-top: 2px; }

    details.compact-notes { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; }
    details.compact-notes summary { font-size: 0.85rem; font-weight: bold; cursor: pointer; color: var(--text-muted); }
    details.compact-notes[open] summary { color: var(--text-main); margin-bottom: 8px; }

    .mnemonic-block { border-left: 2px solid var(--accent-blue); padding-left: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    .mnemonic-title { font-size: 0.72rem; color: var(--accent-blue); font-weight: bold; }

    /* Vocabulary Accordion & Controls */
    .vocab-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .vocab-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    
    .vocab-selector { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 6px; border: 1px solid var(--border-color); }
    .vocab-btn { font-size: 0.75rem; padding: 3px 8px; border: none; border-radius: 4px; background: transparent; color: var(--text-muted); cursor: pointer; }
    .vocab-btn.active { background: var(--accent-blue); color: #0f172a; font-weight: bold; }

    .vocab-list { display: flex; flex-direction: column; gap: 6px; max-height: 350px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
    .vocab-item { background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; transition: border-color 0.2s, background-color 0.2s; }
    
    .vocab-item.has-sentence { border-color: var(--accent-blue); border-left: 4px solid var(--accent-blue); }
    .vocab-item.clickable { cursor: pointer; }
    .vocab-item.clickable:hover { border-color: var(--accent-blue); background: var(--card-hover); }

    .vocab-word-container { font-size: 1.05rem; font-weight: bold; color: var(--vocab-word-color); line-height: 1.3; flex: 0 1 auto; min-width: 0; word-break: break-word; transition: font-size 0.15s ease; }
    .vocab-word-container.large-vocab { font-size: 2.1rem; }
    .vocab-word-container ruby { ruby-position: over; }
    .vocab-word-container rt { font-size: 0.55em; color: var(--text-muted); font-weight: normal; }
    
    .vocab-inline-reading { font-size: 0.75em; font-weight: normal; color: var(--text-muted); margin-left: 4px; display: inline-block; word-break: break-word; }

    .vocab-meaning-wrapper { flex: 1 1 120px; min-width: 0; font-size: 0.8rem; line-height: 1.25; color: var(--text-main); word-break: break-word; }
    .vocab-meaning-genki { color: var(--accent-blue); }
    .vocab-meaning-wk { color: var(--accent-wk); }
    .vocab-meaning-kaishi { color: var(--accent-kaishi); }

    .vocab-tag-group { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; margin-left: auto; flex-shrink: 0; }
    .vocab-tag { font-size: 0.65rem; background: var(--card-hover); padding: 1px 5px; border-radius: 4px; white-space: nowrap; font-weight: 600; line-height: 1.2; }

    /* Sentence Modal Specific Styling */
    #sentence-modal-overlay { z-index: 1100; }
    .sentence-block { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .sentence-block.source-wk { border-left: 4px solid var(--accent-wk); }
    .sentence-block.source-kaishi { border-left: 4px solid var(--accent-kaishi); }
    .sentence-block:last-child { margin-bottom: 0; }
    
    .sentence-japanese { font-size: 2.7rem; line-height: 1.6; margin-bottom: 8px; color: var(--text-main); font-family: "Kaku Gothic Pro", "Noto Sans JP", sans-serif; }
    .sentence-japanese ruby { ruby-position: over; }
    .sentence-japanese rt { font-size: 0.6em; color: var(--accent-blue); }
    
    .sentence-english { font-size: 0.9rem; color: transparent; background-color: #334155; border-radius: 4px; padding: 2px 6px; user-select: none; transition: color 0.2s ease, background-color 0.2s ease; display: inline-block; cursor: default; }
    .sentence-english:hover { color: var(--text-muted); background-color: transparent; padding: 0; }
  </style>
</head>
<body>

  <header>
    <div class="control-group">
      <div>
        <label for="filter-select">Group By</label><br>
        <select id="filter-select">
          <option value="unicode">Unicode</option>
          <option value="jouyou">Jouyou Grade</option>
          <option value="jlpt">JLPT Level</option>
          <option value="genki">Genki Chapter</option>
          <option value="tobira">Tobira Chapter</option>
          <option value="wk">WaniKani Level</option>
        </select>
      </div>

      <div>
        <label for="search-input">Search</label><br>
        <input type="text" id="search-input" placeholder="Kanji, meaning, reading...">
      </div>

      <div>
        <label>&nbsp;</label><br>
        <button id="marking-toggle" class="btn btn-toggle">Marking Mode: OFF</button>
      </div>

      <div>
        <label>&nbsp;</label><br>
        <button id="compact-toggle" class="btn btn-toggle">Compact: OFF</button>
      </div>
    </div>

    <div class="control-group">
      <div class="stats">
        <span class="stat-badge stat-red" id="count-red">Red: 0</span>
        <span class="stat-badge stat-yellow" id="count-yellow">Yellow: 0</span>
        <span class="stat-badge stat-green" id="count-green">Green: 0</span>
      </div>

      <button id="export-btn" class="btn">Export Marks</button>
      <button id="import-btn" class="btn">Import Marks</button>
      <input type="file" id="import-file" accept=".json" style="display: none;">
      <input type="file" id="data-file" accept=".json" style="display: none;">
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar-nav">
      <div class="sidebar-title">Quick Nav</div>
      <ul class="sidebar-links" id="sidebar-links"></ul>
    </aside>

    <main id="grid-container" class="grid-content">Loading data...</main>
  </div>

  <!-- Main Preview Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content side-layout" id="modal-content-box">
      <button class="modal-close" id="modal-close">&times;</button>
      
      <div class="modal-header">
        <div class="modal-kanji" id="m-kanji">-</div>
        <div>
          <h2 id="m-meaning" style="color: var(--accent-blue);">Meaning</h2>
          <div class="tag-container" id="m-tags"></div>
          
          <div class="modal-mark-box">
            <span class="mark-all-label">Status:</span>
            <div id="m-mark-dots" style="display: flex; gap: 4px;"></div>
          </div>
        </div>
      </div>

      <div class="modal-body-container">
        <div class="modal-main-info">
          <div class="readings-box">
            <div class="reading-item"><div class="label">Onyomi</div><div class="val" id="m-onyomi">-</div></div>
            <div class="reading-item"><div class="label">Kunyomi</div><div class="val" id="m-kunyomi">-</div></div>
            <div class="reading-item"><div class="label">Jouyou Readings</div><div class="val" id="m-jouyou-readings">-</div></div>
          </div>

          <div class="modal-meta-grid" id="m-meta-grid"></div>

          <details class="compact-notes" open>
            <summary>Mnemonics & Notes</summary>
            <div id="m-mnemonics"></div>
          </details>
        </div>

        <!-- Vocabulary Section -->
        <details class="compact-notes" id="m-vocab-details" open>
          <summary>Associated Vocabulary</summary>
          <div class="vocab-section-header" style="margin-top: 8px;">
            <div class="vocab-controls">
              <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">SOURCE:</span>
              <div class="vocab-selector">
                <button class="vocab-btn" data-source="genki">Genki</button>
                <button class="vocab-btn" data-source="wk">WaniKani</button>
                <button class="vocab-btn" data-source="kaishi">Kaishi</button>
                <button class="vocab-btn active" data-source="all">All</button>
              </div>
            </div>

            <div class="vocab-controls">
              <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">OPTIONS:</span>
              <div class="vocab-selector">
                <button class="vocab-btn" id="btn-vocab-size">Font: Standard</button>
                <button class="vocab-btn" id="btn-vocab-layout">Layout: Side</button>
              </div>
            </div>
          </div>
          <div class="vocab-list" id="m-vocab-list"></div>
        </details>
      </div>
    </div>
  </div>

  <!-- Sentence Modal Overlay -->
  <div class="modal-overlay" id="sentence-modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
      <button class="modal-close" id="sentence-modal-close">&times;</button>
      <div style="margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
        <h3 id="s-vocab-word" style="color: var(--vocab-word-color); font-size: 1.5rem;">Vocab</h3>
        <p id="s-vocab-reading" style="color: var(--text-muted); font-size: 0.9rem;"></p>
      </div>
      <div id="s-modal-body"></div>
    </div>
  </div>

  <script>
    let kanjiData = [];
    let isMarkingMode = false;
    let isCompactMode = false;
    let isLargeVocabFont = false;
    let isSideLayout = true;
    let markState = JSON.parse(localStorage.getItem('kanji_color_state') || '{}');
    let currentModalKanji = null;
    let activeVocabSource = 'all';

    const gridContainer = document.getElementById('grid-container');
    const sidebarLinks = document.getElementById('sidebar-links');
    const filterSelect = document.getElementById('filter-select');
    const searchInput = document.getElementById('search-input');
    const markingToggle = document.getElementById('marking-toggle');
    const compactToggle = document.getElementById('compact-toggle');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContentBox = document.getElementById('modal-content-box');
    const modalClose = document.getElementById('modal-close');

    const sentenceModalOverlay = document.getElementById('sentence-modal-overlay');
    const sentenceModalClose = document.getElementById('sentence-modal-close');

    // Controls Logic
    markingToggle.addEventListener('click', () => {
      isMarkingMode = !isMarkingMode;
      markingToggle.classList.toggle('active', isMarkingMode);
      markingToggle.textContent = `Marking Mode: ${isMarkingMode ? 'ON' : 'OFF'}`;
      document.body.classList.toggle('marking-mode', isMarkingMode);
    });

    compactToggle.addEventListener('click', () => {
      isCompactMode = !isCompactMode;
      compactToggle.classList.toggle('active', isCompactMode);
      compactToggle.textContent = `Compact: ${isCompactMode ? 'ON' : 'OFF'}`;
      document.body.classList.toggle('compact-mode', isCompactMode);
    });

    filterSelect.addEventListener('change', renderGrid);
    searchInput.addEventListener('input', renderGrid);

    // Export / Import Marks
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(markState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "kanji_marks.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    const importBtn = document.getElementById('import-btn');
    const importFileInput = document.getElementById('import-file');
    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (typeof imported === 'object' && imported !== null) {
            markState = imported;
            localStorage.setItem('kanji_color_state', JSON.stringify(markState));
            renderGrid();
            alert('Marks imported successfully!');
          }
        } catch (err) {
          alert('Failed to parse imported JSON file.');
        }
      };
      reader.readAsText(file);
    });

    async function loadData() {
      try {
        const res = await fetch('kanji_data.json');
        if (!res.ok) throw new Error("HTTP " + res.status);
        kanjiData = await res.json();
        renderGrid();
      } catch (err) {
        gridContainer.innerHTML = `
          <div style="text-align:center; padding: 40px; background: var(--card-bg); border-radius: 8px;">
            <p style="margin-bottom: 12px; color: var(--text-muted);">Could not auto-load <code>kanji_data.json</code>.</p>
            <button class="btn" onclick="document.getElementById('data-file').click()">Load JSON File Manually</button>
          </div>`;
      }
    }

    function getGroupKey(item, filter) {
      if (filter === 'jouyou') {
        const grade = item.jouyou_grade !== undefined && item.jouyou_grade !== null && item.jouyou_grade !== '' ? item.jouyou_grade : item.grade;
        return grade ? `Grade ${grade}` : 'Uncategorized';
      }
      if (filter === 'jlpt') {
        const jlpt = item.jlpt_level !== undefined && item.jlpt_level !== null && item.jlpt_level !== '' ? item.jlpt_level : item.jlpt;
        return jlpt ? `JLPT N${jlpt}` : 'Uncategorized';
      }
      if (filter === 'genki') {
        const ch = item.genki_chapter || item.genki;
        return ch ? `Genki Ch ${ch}` : 'Uncategorized';
      }
      if (filter === 'tobira') {
        const ch = item.tobira_chapter || item.tobira;
        return ch ? `Tobira Ch ${ch}` : 'Uncategorized';
      }
      if (filter === 'wk') {
        const lvl = item.wk_level || item.wk;
        return lvl ? `WaniKani Level ${lvl}` : 'Uncategorized';
      }
      if (filter === 'unicode') {
        if (!item.kanji) return 'Uncategorized';
        const code = item.kanji.charCodeAt(0);
        const start = Math.floor(code / 256) * 256;
        const end = start + 255;
        return `U+${start.toString(16).toUpperCase()} - U+${end.toString(16).toUpperCase()}`;
      }
      return 'All Kanji';
    }

    function shortenNavTitle(key) {
      return key
        .replace('WaniKani Level', 'WK')
        .replace('Genki Ch', 'GK')
        .replace('Tobira Ch', 'TB')
        .replace('JLPT ', '')
        .replace('Grade ', 'G')
        .replace('Uncategorized', 'Uncat');
    }

    function renderGrid() {
      const filter = filterSelect.value;
      const query = searchInput.value.toLowerCase().trim();

      const filtered = kanjiData.filter(k => {
        if (!query) return true;
        return (k.kanji && k.kanji.includes(query)) ||
               (k.meaning && k.meaning.toLowerCase().includes(query)) ||
               (k.onyomi && k.onyomi.includes(query)) ||
               (k.kunyomi && k.kunyomi.includes(query));
      });

      const groups = {};
      filtered.forEach(item => {
        const key = getGroupKey(item, filter);
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      gridContainer.innerHTML = '';
      sidebarLinks.innerHTML = '';

      const sortedKeys = Object.keys(groups).sort((a, b) => {
        if (a === 'Uncategorized') return 1;
        if (b === 'Uncategorized') return -1;
        
        // Custom sorting for JLPT to ensure 5 to 1 order (N5, N4, N3, N2, N1)
        if (filter === 'jlpt') {
          const numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
          const numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
          return numB - numA; // Descending order (5 down to 1)
        }

        return a.localeCompare(b, undefined, { numeric: true });
      });

      sortedKeys.forEach((key, idx) => {
        const secId = `section-${idx}`;

        if (filter !== 'unicode') {
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'sidebar-link';
          const shortTitle = shortenNavTitle(key);
          link.textContent = `${shortTitle} (${groups[key].length})`;
          link.title = `${key} (${groups[key].length})`;
          link.addEventListener('click', () => {
            const sec = document.getElementById(secId);
            if (sec) sec.scrollIntoView({ behavior: 'smooth' });
          });
          li.appendChild(link);
          sidebarLinks.appendChild(li);
        }

        renderSection(key, groups[key], secId);
      });

      if (filter === 'unicode') {
        sidebarLinks.innerHTML = '<li class="sidebar-link" style="color:var(--text-muted); cursor:default; white-space:normal; font-size:0.75rem;">Sidebar disabled for Unicode blocks view.</li>';
      }

      updateStats();
    }

    function renderSection(title, items, id) {
      const isUncategorized = title === 'Uncategorized';
      let sec;

      if (isUncategorized) {
        sec = document.createElement('details');
        sec.className = 'uncategorized-details';
        sec.id = id;
        const summary = document.createElement('summary');
        summary.innerHTML = `<div class="section-title"><span>${title}</span> <span class="count">(${items.length})</span></div>`;
        sec.appendChild(summary);
      } else {
        sec = document.createElement('section');
        sec.className = 'section-container';
        sec.id = id;

        const headerBar = document.createElement('div');
        headerBar.className = 'section-header-bar';
        headerBar.innerHTML = `
          <div class="section-title"><span>${title}</span> <span class="count">(${items.length})</span></div>
          <div class="mark-all-group">
            <span class="mark-all-label">Mark All:</span>
            <button class="mark-dot dot-clear" title="Clear All"></button>
            <button class="mark-dot dot-red" title="Mark Red"></button>
            <button class="mark-dot dot-yellow" title="Mark Yellow"></button>
            <button class="mark-dot dot-green" title="Mark Green"></button>
          </div>
        `;

        const markDots = headerBar.querySelectorAll('.mark-dot');
        const states = [0, 1, 2, 3];
        markDots.forEach((dot, idx) => {
          dot.addEventListener('click', () => {
            const targetState = states[idx];
            items.forEach(k => {
              if (targetState === 0) delete markState[k.kanji];
              else markState[k.kanji] = targetState;
            });
            localStorage.setItem('kanji_color_state', JSON.stringify(markState));
            renderGrid();
          });
        });

        sec.appendChild(headerBar);
      }

      sec.appendChild(createKanjiGrid(items));
      gridContainer.appendChild(sec);
    }

    function createKanjiGrid(items) {
      const grid = document.createElement('div');
      grid.className = 'kanji-grid';
      items.forEach(k => {
        const card = document.createElement('div');
        card.className = 'kanji-card';
        card.textContent = k.kanji;
        card.setAttribute('data-kanji', k.kanji);
        card.setAttribute('data-state', markState[k.kanji] || 0);

        card.addEventListener('click', () => {
          if (isMarkingMode) {
            let currentState = parseInt(card.getAttribute('data-state') || '0', 10);
            let nextState = (currentState + 1) % 4;
            if (nextState === 0) delete markState[k.kanji];
            else markState[k.kanji] = nextState;

            card.setAttribute('data-state', nextState);
            localStorage.setItem('kanji_color_state', JSON.stringify(markState));
            updateStats();
          } else {
            openModal(k);
          }
        });

        grid.appendChild(card);
      });
      return grid;
    }

    function updateStats() {
      const counts = { 1: 0, 2: 0, 3: 0 };
      Object.values(markState).forEach(val => { if (counts[val] !== undefined) counts[val]++; });
      document.getElementById('count-red').textContent = `Red: ${counts[1]}`;
      document.getElementById('count-yellow').textContent = `Yellow: ${counts[2]}`;
      document.getElementById('count-green').textContent = `Green: ${counts[3]}`;
    }

    function openModal(k) {
      currentModalKanji = k;
      document.getElementById('m-kanji').textContent = k.kanji || '-';
      document.getElementById('m-meaning').textContent = k.meaning || 'No meaning';
      document.getElementById('m-onyomi').textContent = k.onyomi || '-';
      document.getElementById('m-kunyomi').textContent = k.kunyomi || '-';
      document.getElementById('m-jouyou-readings').textContent = k.jouyou_readings || '-';

      const tagsBox = document.getElementById('m-tags');
      tagsBox.innerHTML = '';
      const tags = [];
      const gradeVal = k.jouyou_grade !== undefined && k.jouyou_grade !== null && k.jouyou_grade !== '' ? k.jouyou_grade : k.grade;
      const jlptVal = k.jlpt_level !== undefined && k.jlpt_level !== null && k.jlpt_level !== '' ? k.jlpt_level : k.jlpt;

      if (gradeVal) tags.push(`Grade ${gradeVal}`);
      if (jlptVal) tags.push(`JLPT N${jlptVal}`);
      if (k.wk_level || k.wk) tags.push(`WK Lvl ${k.wk_level || k.wk}`);
      if (k.genki_chapter || k.genki) tags.push(`Genki Ch ${k.genki_chapter || k.genki}`);
      if (k.tobira_chapter || k.tobira) tags.push(`Tobira Ch ${k.tobira_chapter || k.tobira}`);
      tags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = t;
        tagsBox.appendChild(span);
      });

      const dotsBox = document.getElementById('m-mark-dots');
      dotsBox.innerHTML = '';
      [0, 1, 2, 3].forEach(st => {
        const dot = document.createElement('button');
        const colorClass = st === 0 ? 'dot-clear' : (st === 1 ? 'dot-red' : (st === 2 ? 'dot-yellow' : 'dot-green'));
        dot.className = `mark-dot ${colorClass}`;
        if ((markState[k.kanji] || 0) === st) dot.style.transform = 'scale(1.25)';
        dot.addEventListener('click', () => {
          if (st === 0) delete markState[k.kanji];
          else markState[k.kanji] = st;
          localStorage.setItem('kanji_color_state', JSON.stringify(markState));
          const card = document.querySelector(`.kanji-card[data-kanji="${k.kanji}"]`);
          if (card) card.setAttribute('data-state', st);
          updateStats();
          openModal(k);
        });
        dotsBox.appendChild(dot);
      });

      const metaGrid = document.getElementById('m-meta-grid');
      metaGrid.innerHTML = `
        <div class="meta-box"><div class="meta-label">Strokes</div><div class="meta-val">${k.strokes || k.stroke_count || '-'}</div></div>
        <div class="meta-box"><div class="meta-label">Radical</div><div class="meta-val">${k.radical || '-'}</div></div>
        <div class="meta-box"><div class="meta-label">Frequency</div><div class="meta-val">${k.frequency || k.freq || '-'}</div></div>
        <div class="meta-box"><div class="meta-label">Grade</div><div class="meta-val">${gradeVal || '-'}</div></div>
        <div class="meta-box"><div class="meta-label">JLPT</div><div class="meta-val">${jlptVal ? 'N' + jlptVal : '-'}</div></div>
      `;

      const mnemBox = document.getElementById('m-mnemonics');
      mnemBox.innerHTML = '';
      if (k.mnemonic_meaning || k.meaning_mnemonic) {
        mnemBox.innerHTML += `<div class="mnemonic-block"><div class="mnemonic-title">Meaning Mnemonic</div><div>${k.mnemonic_meaning || k.meaning_mnemonic}</div></div>`;
      }
      if (k.mnemonic_reading || k.reading_mnemonic) {
        mnemBox.innerHTML += `<div class="mnemonic-block"><div class="mnemonic-title">Reading Mnemonic</div><div>${k.mnemonic_reading || k.reading_mnemonic}</div></div>`;
      }
      if (k.notes) {
        mnemBox.innerHTML += `<div class="mnemonic-block"><div class="mnemonic-title">Notes</div><div>${k.notes}</div></div>`;
      }
      if (!mnemBox.innerHTML) {
        mnemBox.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted);">No mnemonics or notes available.</div>`;
      }

      renderModalVocab();
      modalOverlay.classList.add('active');
    }

    function matchesReading(singleRead, targetList) {
      const cleanSingle = (singleRead || '').trim();
      return targetList.some(r => r.trim() === cleanSingle);
    }

    function openSentenceModal(v) {
      document.getElementById('s-vocab-word').textContent = v.word;
      document.getElementById('s-vocab-reading').textContent = v.reading || '';
      
      const modalBody = document.getElementById('s-modal-body');
      modalBody.innerHTML = '';

      let sentencesFound = 0;

      // Check WaniKani sentences
      if (v.sentences_wk && v.sentences_wk.length > 0) {
        v.sentences_wk.forEach(s => {
          if (s.sentence) {
            sentencesFound++;
            const block = document.createElement('div');
            block.className = 'sentence-block source-wk';
            block.innerHTML = `
              <div class="sentence-japanese">${s.sentence}</div>
              <div class="sentence-english">${s.meaning || ''}</div>
            `;
            modalBody.appendChild(block);
          }
        });
      }

      // Check Kaishi sentences
      if (v.sentences_kaishi && v.sentences_kaishi.length > 0) {
        v.sentences_kaishi.forEach(s => {
          if (s.sentence_html || s.sentence) {
            sentencesFound++;
            const block = document.createElement('div');
            block.className = 'sentence-block source-kaishi';
            const jpDisplay = s.sentence_html || s.sentence;
            block.innerHTML = `
              <div class="sentence-japanese">${jpDisplay}</div>
              <div class="sentence-english">${s.sentence_meaning || s.meaning || ''}</div>
            `;
            modalBody.appendChild(block);
          }
        });
      }

      if (sentencesFound === 0) {
        modalBody.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem;">No example sentences available for this vocabulary item.</div>`;
      }

      sentenceModalOverlay.classList.add('active');
    }

    function renderModalVocab() {
      if (!currentModalKanji) return;
      const listContainer = document.getElementById('m-vocab-list');
      listContainer.innerHTML = '';

      const gList = (currentModalKanji.genki_vocab || []).map(v => ({
        type: 'genki',
        word: v.word,
        reading: v.furigana || v.reading || '',
        readings: [v.furigana || v.reading || ''],
        meaning: v.meaning || '',
        sortKey: typeof v.clean_chapter === 'number' ? v.clean_chapter : 999,
        tag: `GK${v.clean_chapter ?? '?'}`
      }));

      const wkList = (currentModalKanji.wk_vocab || []).map(v => {
        const sentences = [];
        if (v.sentence_1) sentences.push({ sentence: v.sentence_1, meaning: v.sentence_1_meaning });
        if (v.sentence_2) sentences.push({ sentence: v.sentence_2, meaning: v.sentence_2_meaning });
        if (v.sentence_3) sentences.push({ sentence: v.sentence_3, meaning: v.sentence_3_meaning });

        return {
          type: 'wk',
          word: v.word,
          reading: v.reading || '',
          readings: [v.reading || ''],
          meaning: v.meaning || '',
          sortKey: typeof v.level === 'number' ? v.level : 999,
          tag: `WK${v.level ?? '?'}`,
          sentences_wk: sentences
        };
      });

      const kaishiList = (currentModalKanji.kaishi_vocab || []).map(v => ({
        type: 'kaishi',
        word: v.word,
        reading: v.reading || '',
        readings: v.readings || [v.reading || ''],
        meaning: v.meaning || '',
        sortKey: typeof v.frequency_rank === 'number' ? v.frequency_rank : 999999,
        tag: `K#${v.frequency_rank ?? '?'}`,
        sentences_kaishi: v.sentence || v.sentence_html ? [{ 
          sentence: v.sentence, 
          sentence_meaning: v.sentence_meaning, 
          sentence_html: v.sentence_html 
        }] : []
      }));

      let itemsToRender = [];

      if (activeVocabSource === 'genki') itemsToRender = gList.sort((a,b) => a.sortKey - b.sortKey);
      else if (activeVocabSource === 'wk') itemsToRender = wkList.sort((a,b) => a.sortKey - b.sortKey);
      else if (activeVocabSource === 'kaishi') itemsToRender = kaishiList.sort((a,b) => a.sortKey - b.sortKey);
      else {
        const combined = [];
        const processedWk = new Set();
        const processedKaishi = new Set();

        gList.forEach(gItem => {
          const matchedWkIdx = wkList.findIndex((w, idx) => !processedWk.has(idx) && w.word === gItem.word && matchesReading(w.reading, gItem.readings));
          const matchedKaishiIdx = kaishiList.findIndex((k, idx) => !processedKaishi.has(idx) && k.word === gItem.word && (matchesReading(gItem.reading, k.readings) || k.readings.some(r => matchesReading(r, gItem.readings))));

          let meaningsArr = [{ type: 'genki', text: gItem.meaning }];
          let tagsArr = [gItem.tag];
          let sentences_wk = [];
          let sentences_kaishi = [];

          if (matchedWkIdx !== -1) {
            processedWk.add(matchedWkIdx);
            const wItem = wkList[matchedWkIdx];
            meaningsArr.push({ type: 'wk', text: wItem.meaning });
            tagsArr.push(wItem.tag);
            if (wItem.sentences_wk) sentences_wk.push(...wItem.sentences_wk);
          }

          if (matchedKaishiIdx !== -1) {
            processedKaishi.add(matchedKaishiIdx);
            const kItem = kaishiList[matchedKaishiIdx];
            meaningsArr.push({ type: 'kaishi', text: kItem.meaning });
            tagsArr.push(kItem.tag);
            if (kItem.sentences_kaishi) sentences_kaishi.push(...kItem.sentences_kaishi);
          }

          combined.push({
            word: gItem.word,
            reading: gItem.reading,
            meanings: meaningsArr,
            tags: tagsArr,
            sortKey: gItem.sortKey,
            sentences_wk: sentences_wk,
            sentences_kaishi: sentences_kaishi
          });
        });

        wkList.forEach((wItem, idx) => {
          if (!processedWk.has(idx)) {
            const matchedKaishiIdx = kaishiList.findIndex((k, kIdx) => !processedKaishi.has(kIdx) && k.word === wItem.word && matchesReading(wItem.reading, k.readings));
            let meaningsArr = [{ type: 'wk', text: wItem.meaning }];
            let tagsArr = [wItem.tag];
            let sentences_wk = wItem.sentences_wk || [];
            let sentences_kaishi = [];

            if (matchedKaishiIdx !== -1) {
              processedKaishi.add(matchedKaishiIdx);
              const kItem = kaishiList[matchedKaishiIdx];
              meaningsArr.push({ type: 'kaishi', text: kItem.meaning });
              tagsArr.push(kItem.tag);
              if (kItem.sentences_kaishi) sentences_kaishi.push(...kItem.sentences_kaishi);
            }

            combined.push({
              word: wItem.word,
              reading: wItem.reading,
              meanings: meaningsArr,
              tags: tagsArr,
              sortKey: wItem.sortKey,
              sentences_wk: sentences_wk,
              sentences_kaishi: sentences_kaishi
            });
          }
        });

        kaishiList.forEach((kItem, idx) => {
          if (!processedKaishi.has(idx)) {
            combined.push({
              word: kItem.word,
              reading: kItem.reading,
              meanings: [{ type: 'kaishi', text: kItem.meaning }],
              tags: [kItem.tag],
              sortKey: kItem.sortKey,
              sentences_wk: [],
              sentences_kaishi: kItem.sentences_kaishi || []
            });
          }
        });

        itemsToRender = combined.sort((a,b) => a.sortKey - b.sortKey);
      }

      if (itemsToRender.length === 0) {
        listContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted);">No vocabulary items found.</div>`;
        return;
      }

      itemsToRender.forEach(v => {
        const item = document.createElement('div');
        item.className = 'vocab-item';

        const hasWKSentences = v.sentences_wk && v.sentences_wk.length > 0;
        const hasKaishiSentences = v.sentences_kaishi && v.sentences_kaishi.length > 0;
        const hasSentences = hasWKSentences || hasKaishiSentences;

        if (hasSentences) {
          item.classList.add('clickable', 'has-sentence');
          item.title = 'Click to view example sentences';
          item.addEventListener('click', () => openSentenceModal(v));
        }

        const rawReading = v.reading ? v.reading.trim() : '';
        let wordHtml = (rawReading.includes('・') || rawReading.includes(',') || rawReading.includes('(')) 
          ? `<span>${v.word}</span><span class="vocab-inline-reading">(${rawReading})</span>`
          : (rawReading && rawReading !== v.word ? `<ruby>${v.word}<rt>${rawReading}</rt></ruby>` : `<span>${v.word}</span>`);

        let meaningHtml = '';
        if (v.meanings) {
          meaningHtml = v.meanings.map(m => `<span class="vocab-meaning-${m.type}">${m.text}</span>`).join(' <span style="color:var(--text-muted)">/</span> ');
        } else {
          meaningHtml = `<span class="vocab-meaning-${v.type}">${v.meaning || ''}</span>`;
        }

        const tagsArr = v.tags || [v.tag];
        const tagsHtml = tagsArr.map(t => `<span class="vocab-tag">${t}</span>`).join('');

        item.innerHTML = `
          <div class="vocab-word-container ${isLargeVocabFont ? 'large-vocab' : ''}">${wordHtml}</div>
          <div class="vocab-meaning-wrapper">${meaningHtml}</div>
          <div class="vocab-tag-group">${tagsHtml}</div>
        `;
        listContainer.appendChild(item);
      });
    }

    document.querySelectorAll('.vocab-btn[data-source]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.vocab-btn[data-source]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeVocabSource = e.target.getAttribute('data-source');
        renderModalVocab();
      });
    });

    const btnVocabSize = document.getElementById('btn-vocab-size');
    btnVocabSize.addEventListener('click', () => {
      isLargeVocabFont = !isLargeVocabFont;
      btnVocabSize.textContent = `Font: ${isLargeVocabFont ? 'Large' : 'Standard'}`;
      renderModalVocab();
    });

    const btnVocabLayout = document.getElementById('btn-vocab-layout');
    btnVocabLayout.addEventListener('click', () => {
      isSideLayout = !isSideLayout;
      btnVocabLayout.textContent = `Layout: ${isSideLayout ? 'Side' : 'Stacked'}`;
      modalContentBox.classList.toggle('side-layout', isSideLayout);
    });

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    sentenceModalClose.addEventListener('click', () => sentenceModalOverlay.classList.remove('active'));
    sentenceModalOverlay.addEventListener('click', (e) => {
      if (e.target === sentenceModalOverlay) sentenceModalOverlay.classList.remove('active');
    });

    const dataFileInput = document.getElementById('data-file');
    if (dataFileInput) {
      dataFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            kanjiData = JSON.parse(event.target.result);
            renderGrid();
          } catch (err) {
            alert('Failed to parse JSON file. Ensure it is valid JSON.');
          }
        };
        reader.readAsText(file);
      });
    }

    loadData();
  </script>
</body>
</html>
